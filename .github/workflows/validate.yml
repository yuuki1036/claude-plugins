name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # チェック名（`validate (ubuntu-latest)` / `validate (macos-latest)`。job 名と matrix の値から決まる）は
  # ルールセット「main: PR 必須」の必須のチェック名。job 名や matrix を変える（チェック名が変わる）ときは
  # ルールセットの側も合わせる。合わないと必須のチェックが来ず、auto-merge がいつまでもマージしない
  validate:
    # 回帰テストは CI だけで回す（2026-11-08 決定。pre-commit からは外した / GitHub issue #436）。
    # macOS を足すのは、開発機と同じ OS の差（bash 3.2・BSD の sed / grep・ロケール）を拾うため。
    # 以前はこれを pre-commit が開発機で拾っていた。公開 repo なので macOS の runner に料金はかからない
    strategy:
      # 片方が落ちても、もう片方の結果を最後まで出す（OS 差なのか共通の失敗なのかを見分ける）
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # check-version-bump が差分範囲を解決するために全履歴が要る。
          # 既定の fetch-depth:1 だと grafted な shallow clone になり、
          # base も --depth=1 で取ると merge base が shallow 境界の外に出て
          # `git diff base...HEAD` が `fatal: no merge base` で必ず落ちる。
          fetch-depth: 0

      # macOS の job ではテストが叩く `bash` を `/bin/bash`（3.2）に固定する。開発機と利用者の macOS で
      # hook を起動するのはこの bash で、bash 3.2 でしか起きない壊れ方（`set -u` 下の空配列の展開・
      # bash 4 以降の構文など）を拾うのが macOS を足した目的。runner には Homebrew の bash 5 が
      # PATH の先に居ることがあるので、`/bin/bash` だけを置いた dir を PATH の先頭に足す
      # （`/bin` ごと先頭にすると他のコマンドの解決まで変わる）
      - name: pin-bash-3.2
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"

      # テストが叩く `bash` を残す。macOS で 3.2 になっていなければ止める（表示だけにすると、
      # runner の PATH が変わって 5 系で回り始めても誰も気づかない）
      - name: show-shell
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
        # 版は `$BASH_VERSION` で取る（`bash --version | head -1` は Actions 既定の `-o pipefail` の下で
        # head が先に閉じると SIGPIPE で落ちうる）
        run: |
          command -v bash
          ver="$(bash -c 'echo "$BASH_VERSION"')"
          echo "bash ${ver}"
          if [ "$RUNNER_OS_NAME" = "macOS" ]; then
            case "$ver" in
              3.*) ;;
              *) echo "::error::macOS の job で bash が 3.2 になっていない（${ver}）"; exit 1 ;;
            esac
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # jsonschema が無いと validate_ssot.py の try_validate_schema が silent skip し、
      # 「ローカルでは落ちるが CI では通る」逆転が起きる（2026-07 精査で検出）
      # pyyaml は recall fixture の judge.py が expected.yaml を読むのに要る（GitHub issue #400）。
      # 無いと test_recall_judge.py が落ちる
      - name: install-deps
        run: pip install jsonschema pyyaml

      # plugin.json / marketplace.json / hooks.json のスキーマ準拠と SSoT 同期
      - name: validate-ssot
        run: bash .claude-plugin/scripts/validate-ssot.sh

      # 差分の起点を 1 箇所で決める。**quality と version-bump が同じ起点を使う**
      # （バージョン基準を各ステップで別々に決めると、片方だけ no-op になっても気づけない）
      - name: resolve-diff-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF"
            base="origin/${BASE_REF}"
          elif [ -n "$BEFORE_SHA" ] \
            && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            # push: 今回 push された範囲を見る。初回 push / force push 直後や
            # 履歴から消えた SHA では before が使えないため直前コミットで代用する
            base="$BEFORE_SHA"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            base="HEAD~1"
          else
            base=""   # 初回コミット: 比較対象が無い
          fi
          echo "比較起点: ${base:-（無し）}"
          echo "DIFF_BASE=$base" >> "$GITHUB_ENV"

      # allowed-tools / safe-hook.sh drift / references 参照整合性 / トリガーフレーズ等
      # （warnings は exit code に影響しない。errors のみ fail）
      # QUALITY_VERSION_BASE: bump 契機の検査（vNEXT 残存など）は「作業ツリー vs 基準」で
      # 判定するので、CI で既定の HEAD のままだと必ず no-op になる
      - name: validate-plugin-quality
        env:
          QUALITY_VERSION_BASE: ${{ env.DIFF_BASE }}
        run: python3 .claude-plugin/scripts/validate_plugin_quality.py

      # 検証スクリプト自身の回帰テスト（stdlib unittest。依存は jsonschema / pyyaml だけ）。
      # SSoT pin は pin の初期値も検証と同じ関数で生成するため、実リポジトリに対する
      # 検証だけでは切り出しの欠陥を検出できない（v2.63.1）。期待値を独立に構築する
      # テストがその自己整合の盲点を塞ぐ
      # 起動口は run-tests.py。テストが起動したプロセスの残留を検出・回収する
      # （テスト全件 green のまま 12 本が 4 時間回り続けた実績がある / issue #140）
      # mod（hooks.json の `modules`）のテストは `claude plugin test` で走る（test_plugin_mods.py）。
      # CLI は版を固定して入れる: mods は early access で、版ごとに API が変わりうる。上げるときは
      # ここを変えて CI で確かめる。認証は要らない（テストの環境に fs / network / process は無く、
      # engine の代わりはテスト自身が答える）
      - name: install-claude-cli
        run: npm install -g --no-audit --no-fund @anthropic-ai/claude-code@2.1.288

      # CLAUDE_PLUGIN_TEST_REQUIRED: CLI が無いときの skip を失敗に変える（入れ損ねたまま緑にしない）
      - name: unit-tests
        env:
          CLAUDE_PLUGIN_TEST_REQUIRED: "1"
        run: python3 .claude-plugin/scripts/run-tests.py

      # 変更行の変異テストは **push / PR では回さない**。nightly（`mutation-nightly.yml`）だけで回し、
      # 生存は nightly が GitHub Issue に起票する（ADR-20261103153228）。以前はここで `--max 5 --strict` の
      # スモークを回していたが（GitHub issue #138）、直近 40 回で平均 518 秒・CI の 57% を使って検出 0 回、
      # 2026-10-24 の push はスモークを通ったまま nightly が生存 15 件を出した（#317）。当時は main に
      # 直接入れる運用で、スモークは着地を止めず早く知らせるだけだった。PR 必須にした後も PR の CI に
      # 戻していない（マージ前に止められる回が検出 0 回のスモークではほぼ無いため）

      # pre-commit と同等のバージョンバンプ検査。
      # ローカル hook は --no-verify で迂回できるため CI 側でも検査する。
      # PR で検査したうえで、マージ後の main への push でも走らせる（CI が赤のままマージされた PR を
      # main 側でも拾う保険。ルールセットの必須チェックは 2026-11-08 に足されたが、外したときや
      # job 名と食い違ったときに備えて残す）。
      - name: check-version-bump
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "${DIFF_BASE:-}" ]; then
            echo "比較対象が特定できないため skip（初回コミット）"
            exit 0
          fi
          # PR は三点（merge base 起点）、push は二点（push された範囲そのもの）
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${DIFF_BASE}...HEAD"
          else
            range="${DIFF_BASE}..HEAD"
          fi
          echo "比較範囲: $range"
          changed=$(git diff --name-only "$range")
          errors=0
          for plugin_json in */.claude-plugin/plugin.json; do
            [ -f "$plugin_json" ] || continue
            plugin_dir=${plugin_json%%/*}
            content_changes=$(echo "$changed" | grep "^${plugin_dir}/" | grep -v "^${plugin_dir}/.claude-plugin/plugin.json$" || true)
            if [ -n "$content_changes" ]; then
              if ! echo "$changed" | grep -q "^${plugin_dir}/.claude-plugin/plugin.json$"; then
                echo "::error::${plugin_dir}: プラグイン内容が変更されているのに plugin.json のバージョンバンプがありません"
                errors=1
              fi
              if ! echo "$changed" | grep -q "^${plugin_dir}/CHANGELOG.md$"; then
                echo "::error::${plugin_dir}: バージョンバンプ時は CHANGELOG.md の更新も必要です"
                errors=1
              fi
            fi
          done
          exit $errors
