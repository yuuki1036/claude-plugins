name: mutation-nightly

# 変異テストの**深い方**。push 側（validate.yml）は `--max 5` のスモークに絞ってあり、
# 網羅はこちらが持つ。
#
# **なぜ分けたか**: 変異テストは 1 変異ごとにフルスイートを回すので、所要は最大で
# `--max × スイート実行時間`（落ちる変異は `-f` で最初の失敗で止まる。`-f` を入れる前の実測:
# `--max 15` で 960〜1065 秒 ＝ CI 全体の 94%）。スイートは伸び続ける（524 → 597 件）ので、push 側に深い検証を
# 置いたままだと**変更が大きい回ほど待たされる**構造が悪化する。
# 待つ人が居ない時間帯に寄せて、push 側は即時性だけを担保する。
#
# **失敗は GitHub Issue に起票する**（#138 の「非ブロッキングだと守られない」への答え）。
# nightly を単に fail させるだけだと Actions のタブが赤いまま放置されるので、
# 生存した変異の一覧を本文に入れて起票し、同じ issue が open なら追記する。
# **予算・上限で打ち切った回も起票する**（#288）。生存が無ければ success で終わり、
# 打ち切った分は翌晩の範囲からも外れて、検証されないまま消えていた。いまは打ち切った変異を翌晩に
# 持ち越し（下の「持ち越しの状態」）、起票は持ち越しが 7 日以上解消しない晩と状態を失った晩に絞る。
#
# **比較起点は持ち越しの状態の base（全件を回し切った最後の head）**（#288）。以前は「24 時間前より古い最新のコミット」で、
# 前の晩の head と 24h の境界の間に落ちたコミット（起動が 24h を超えて遅れた晩・遅れて
# main に入った PR のマージ）がどちらの晩の範囲にも入らなかった（39 晩で 4 回）。

on:
  schedule:
    - cron: "0 18 * * *"   # 03:00 JST（前日 18:00 UTC）
  workflow_dispatch:        # 手動起動（範囲は既定で schedule と同じ。手動の run は起点の連鎖に入らない）
    inputs:
      base:
        # 打ち切った変異は持ち越しの状態で翌晩に回る。状態を失った晩などに取りこぼした範囲を
        # 回収するときにだけ起点を指定する（手動の run は持ち越しの連鎖に入らない）
        description: "比較起点のコミット（空なら持ち越しの状態の base）"
        required: false
        default: ""

permissions:
  contents: read
  issues: write
  actions: read     # 前回の run と集計の artifact を引く（resolve-base）

jobs:
  mutation:
    runs-on: ubuntu-latest
    # 1 変異 = フルスイートの所要は伸び続ける（1 変異 113 秒 → 2026-09 には約 200 秒 → 10-07 は約 428 秒で
    # 1 晩 19 個 / #288）。**ここに当たると cancelled になり、結果もログも残らず report も走らない**
    # （2026-09-26 の実測）ので、mutation-test.py 側の `--budget-sec` をこれより手前に置いて、回せた分の
    # 結果を出して終わらせる。既定かつ上限の 6 時間（360 分）からは余裕を取る
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # --base の解決に履歴が要る

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install-deps
        run: pip install jsonschema

      # 起点は前の晩までの持ち越しの状態（artifact `mutation-state`）の base。済みの変異のキーを
      # MUT_SKIP_KEYS に、前の状態を STATE_PREV に書く。状態が無ければ集計を残した最新の schedule run の
      # headSha、それも無ければ最新の run の head か 24h 窓に戻して warning を出す。状態を読めなかった晩は
      # STATE_LOST=1（起票）、API が失敗した晩は STATE_HOLD=1（前の状態を上書きしない）も書く。
      # 判定は mutation-nightly-state.py（YAML に書くとテストできない）。
      # 入力は env 経由で渡す（`${{ }}` を run に直接埋めるとシェルに解釈される）
      - name: resolve-base
        id: base
        env:
          INPUT_BASE: ${{ inputs.base }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .claude-plugin/scripts/mutation-nightly-state.py resolve-base \
            --input-base "$INPUT_BASE" --run-id "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --state-dir "$RUNNER_TEMP/mutation-state" --env-file "$GITHUB_ENV"

      # 止めるのは予算（`--budget-sec`）で、`--max 500` は通常は予算より先に効かない大きさにしてある（`-f` で
      # 落ちる変異が速い晩は先に効きうるが、どちらで打ち切っても未実行は翌晩に持ち越す）。1 変異の
      # timeout は mutation-test.py が予算の残りで頭打ちにするので、最後の変異が hang しても予算を超えない。`--budget-sec 19000` は job の timeout（330 分 =
      # 19800 秒）から準備・artifact・起票の分を引いた値。打ち切った回はログに「予算で未実行 N」と出る。
      # テストコマンドは mutation-test.py の既定（`-f` 付き。落ちる変異は最初の失敗で止まる）
      # PYTHONUNBUFFERED: パイプ越しだと出力がバッファされ、途中で殺された回のログが空になる
      # `--summary-json` は未実行の件数を report に、範囲内の変異と実行した変異のキーを advance-state に渡す。
      # `--skip-keys` は前の晩までに実行した変異（持ち越しの状態が無い晩は付けない）
      - name: mutation-test
        id: mut
        if: env.SKIP != '1'
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python3 .claude-plugin/scripts/mutation-test.py \
            --base "$MUT_BASE" --max 500 --budget-sec 19000 --strict \
            ${MUT_SKIP_KEYS:+--skip-keys "$MUT_SKIP_KEYS"} \
            --summary-json mutation-summary.json 2>&1 | tee mutation.log

      # **集計の有無が「この晩の範囲を回した」印**（翌晩の resolve-base が読む）。集計が無い晩
      # （変異前のテストが赤く exit 2）は何も上げず、その範囲を翌晩に繰り越す。
      # 生存で step が落ちた晩も集計はあるので `!cancelled()` で上げる
      - name: upload-summary
        if: ${{ !cancelled() && env.SKIP != '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-summary
          path: mutation-summary.json
          if-no-files-found: ignore
          overwrite: true   # 同じ run の再実行で前の試行の artifact と衝突しない

      # **持ち越しの状態を進める**（翌晩の resolve-base が読む）。範囲を回し切れば base を head に進め、
      # 打ち切った晩は base を据え置いて実行済みの変異のキーを残す。集計が無い晩（赤い baseline・skip）は
      # 前の状態をそのまま上げ直す。起点を決められなかった晩（resolve-base の失敗）と、前の状態を
      # 読めなかった晩（STATE_HOLD=1）は上げない — 上げると前の状態を新しい起点で上書きして失う。
      # 手動起動の run は持ち越しの連鎖に入らない（resolve-base は schedule の run しか読まない）ので
      # 状態を作らない。作ると report が「持ち越した」と読み、打ち切りを起票しない。
      # **番兵を 0 と比べない**: `if:` は型が違えば数値に寄せ、未設定の env（null）は 0 になる
      - name: advance-state
        id: state
        if: ${{ !cancelled() && github.event_name == 'schedule' && steps.base.outcome == 'success' && env.STATE_HOLD != '1' }}
        run: |
          python3 .claude-plugin/scripts/mutation-nightly-state.py advance \
            --prev "${STATE_PREV:-}" --summary mutation-summary.json \
            --base "${MUT_BASE:-$(git rev-parse HEAD)}" --head "$(git rev-parse HEAD)" \
            --out mutation-state.json

      - name: upload-state
        id: upstate
        if: ${{ !cancelled() && steps.state.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-state
          path: mutation-state.json
          if-no-files-found: error
          overwrite: true

      # **失敗も打ち切りも黙って流さない**。Actions の赤は見に行かないと気づけないので issue にする。
      # 起票するかと本文は mutation-nightly-report.py が決める（YAML に書くとテストできない / #288）。
      # 起点を解決できずに落ちた回（MUT_BASE が空）は変異を回していないので起票しない。
      # 持ち越しの状態がある晩の打ち切りは起票しない（翌晩に回る）。持ち越しが 7 日以上解消しない晩と、
      # 状態を失った晩（STATE_LOST）は起票する。状態を上げられなかった晩は持ち越していないので `--state` を
      # 渡さない（手元の mutation-state.json を読むと「持ち越した」と誤り、打ち切りを黙って捨てる）
      - name: report
        if: ${{ !cancelled() && env.SKIP != '1' && env.MUT_BASE != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MUT_OUTCOME: ${{ steps.mut.outcome }}
          STATE_UP: ${{ steps.upstate.outcome }}
        run: |
          state_args=()
          if [ "$STATE_UP" = success ]; then state_args=(--state mutation-state.json); fi
          title=$(python3 .claude-plugin/scripts/mutation-nightly-report.py \
            --outcome "$MUT_OUTCOME" --summary mutation-summary.json --log mutation.log \
            --base "$MUT_BASE" --head "$(git rev-parse --short HEAD)" --run-url "$RUN_URL" \
            "${state_args[@]}" ${STATE_LOST:+--state-lost} ${STATE_HOLD:+--state-held} \
            --out body.md)
          if [ -z "$title" ]; then
            echo "起票不要（生存なし・打ち切りは持ち越し済み）"
            exit 0
          fi
          # **同じ issue が open なら追記する**（毎晩新しい issue を立てない）。
          # タイトルの前方一致で引く（検索構文のエスケープに依存しない）
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title | startswith("[mutation-nightly]"))][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --label bug --body-file body.md
          fi
