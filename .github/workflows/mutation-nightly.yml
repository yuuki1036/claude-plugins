name: mutation-nightly

# 変異テストの**深い方**。push 側（validate.yml）は `--max 5` のスモークに絞ってあり、
# 網羅はこちらが持つ。
#
# **なぜ分けたか**: 変異テストは 1 変異ごとにフルスイートを回すので、所要は最大で
# `--max × スイート実行時間`（落ちる変異は `-f` で最初の失敗で止まる。`-f` を入れる前の実測:
# `--max 15` で 960〜1065 秒 ＝ CI 全体の 94%）。スイートは伸び続ける（524 → 597 件）ので、push 側に深い検証を
# 置いたままだと**変更が大きい回ほど待たされる**構造が悪化する。
# 待つ人が居ない時間帯に寄せて、push 側は即時性だけを担保する。
#
# **失敗は GitHub Issue に起票する**（#138 の「非ブロッキングだと守られない」への答え）。
# nightly を単に fail させるだけだと Actions のタブが赤いまま放置されるので、
# 生存した変異の一覧を本文に入れて起票し、同じ issue が open なら追記する。
# **予算・上限で打ち切った回も起票する**（#288）。生存が無ければ success で終わり、
# 打ち切った分は翌晩の範囲からも外れて、検証されないまま消えていた。
#
# **比較起点は集計を残した直近の nightly の head**（#288）。以前は「24 時間前より古い最新のコミット」で、
# 前の晩の head と 24h の境界の間に落ちたコミット（起動が 24h を超えて遅れた晩・遅れて
# main に入った PR のマージ）がどちらの晩の範囲にも入らなかった（39 晩で 4 回）。

on:
  schedule:
    - cron: "0 18 * * *"   # 03:00 JST（前日 18:00 UTC）
  workflow_dispatch:        # 手動起動（範囲は既定で schedule と同じ。手動の run は起点の連鎖に入らない）
    inputs:
      base:
        # 予算・上限で打ち切った変異は、翌晩の範囲（この晩の head より後）から外れて二度と回らない。
        # 取りこぼした範囲を回収するときにだけ起点を指定する
        description: "比較起点のコミット（空なら集計を残した直近の nightly の head）"
        required: false
        default: ""

permissions:
  contents: read
  issues: write
  actions: read     # 前回の run と集計の artifact を引く（resolve-base）

jobs:
  mutation:
    runs-on: ubuntu-latest
    # 1 変異 = フルスイートの所要は伸び続ける（1 変異 113 秒 → 2026-09 には約 200 秒 → 10-07 は約 428 秒で
    # 1 晩 19 個 / #288）。**ここに当たると cancelled になり、結果もログも残らず report も走らない**
    # （2026-09-26 の実測）ので、mutation-test.py 側の `--budget-sec` をこれより手前に置いて、回せた分の
    # 結果を出して終わらせる。既定かつ上限の 6 時間（360 分）からは余裕を取る
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # --base の解決に履歴が要る

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install-deps
        run: pip install jsonschema

      # 起点は「集計を artifact に残した最新の schedule run の headSha」。集計を残していない晩
      # （変異前のテストが赤い・cancelled）の範囲は翌晩に繰り越す。引けなければ warning を出して
      # 最新の run の head か 24h 窓に戻す。判定は mutation-nightly-state.py（YAML に書くとテストできない）。
      # 入力は env 経由で渡す（`${{ }}` を run に直接埋めるとシェルに解釈される）
      - name: resolve-base
        env:
          INPUT_BASE: ${{ inputs.base }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .claude-plugin/scripts/mutation-nightly-state.py resolve-base \
            --input-base "$INPUT_BASE" --run-id "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --env-file "$GITHUB_ENV"

      # 止めるのは予算（`--budget-sec`）で、`--max 500` は通常は予算より先に効かない大きさにしてある（`-f` で
      # 落ちる変異が速い晩は先に効きうるが、どちらで打ち切っても未実行は起票される）。1 変異の timeout は mutation-test.py が予算の残りで頭打ちにする
      # ので、最後の変異が hang しても予算を超えない。`--budget-sec 19000` は job の timeout（330 分 =
      # 19800 秒）から準備・artifact・起票の分を引いた値。打ち切った回はログに「予算で未実行 N」と出る。
      # テストコマンドは mutation-test.py の既定（`-f` 付き。落ちる変異は最初の失敗で止まる）
      # PYTHONUNBUFFERED: パイプ越しだと出力がバッファされ、途中で殺された回のログが空になる
      # `--summary-json` は未実行の件数を report に渡す（ログの 1 行を grep で拾わない）
      - name: mutation-test
        id: mut
        if: env.SKIP != '1'
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python3 .claude-plugin/scripts/mutation-test.py \
            --base "$MUT_BASE" --max 500 --budget-sec 19000 --strict \
            --summary-json mutation-summary.json 2>&1 | tee mutation.log

      # **集計の有無が「この晩の範囲を回した」印**（翌晩の resolve-base が読む）。集計が無い晩
      # （変異前のテストが赤く exit 2）は何も上げず、その範囲を翌晩に繰り越す。
      # 生存で step が落ちた晩も集計はあるので `!cancelled()` で上げる
      - name: upload-summary
        if: ${{ !cancelled() && env.SKIP != '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-summary
          path: mutation-summary.json
          if-no-files-found: ignore

      # **失敗も打ち切りも黙って流さない**。Actions の赤は見に行かないと気づけないので issue にする。
      # 起票するかと本文は mutation-nightly-report.py が決める（YAML に書くとテストできない / #288）。
      # 起点を解決できずに落ちた回（MUT_BASE が空）は変異を回していないので起票しない
      - name: report
        if: ${{ !cancelled() && env.SKIP != '1' && env.MUT_BASE != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MUT_OUTCOME: ${{ steps.mut.outcome }}
        run: |
          title=$(python3 .claude-plugin/scripts/mutation-nightly-report.py \
            --outcome "$MUT_OUTCOME" --summary mutation-summary.json --log mutation.log \
            --base "$MUT_BASE" --head "$(git rev-parse --short HEAD)" --run-url "$RUN_URL" \
            --out body.md)
          if [ -z "$title" ]; then
            echo "起票不要（生存・打ち切りなし）"
            exit 0
          fi
          # **同じ issue が open なら追記する**（毎晩新しい issue を立てない）。
          # タイトルの前方一致で引く（検索構文のエスケープに依存しない）
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title | startswith("[mutation-nightly]"))][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --label bug --body-file body.md
          fi
