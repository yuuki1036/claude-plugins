name: mutation-nightly

# 変異テストの**深い方**。push 側（validate.yml）は `--max 5` のスモークに絞ってあり、
# 網羅はこちらが持つ。
#
# **なぜ分けたか**: 変異テストは 1 変異ごとにフルスイートを回すので、所要は
# `--max × スイート実行時間` にそのまま比例する（実測: `--max 15` で 960〜1065 秒 ＝
# CI 全体の 94%）。スイートは伸び続ける（524 → 597 件）ので、push 側に深い検証を
# 置いたままだと**変更が大きい回ほど待たされる**構造が悪化する。
# 待つ人が居ない時間帯に寄せて、push 側は即時性だけを担保する。
#
# **失敗は GitHub Issue に起票する**（#138 の「非ブロッキングだと守られない」への答え）。
# nightly を単に fail させるだけだと Actions のタブが赤いまま放置されるので、
# 生存した変異の一覧を本文に入れて起票し、同じ issue が open なら追記する。
# **予算・上限で打ち切った回も起票する**（#288）。生存が無ければ success で終わり、
# 打ち切った分は翌晩の 24h 窓からも外れて、検証されないまま消えていた。

on:
  schedule:
    - cron: "0 18 * * *"   # 03:00 JST（前日 18:00 UTC）
  workflow_dispatch:        # 手動起動（範囲は既定で同じく直近 24h）
    inputs:
      base:
        # 打ち切られた回（cancelled）の範囲は翌晩の 24h 窓から外れて二度と回らない。
        # 取りこぼした範囲を回収するときにだけ起点を指定する
        description: "比較起点のコミット（空なら直近 24h）"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  mutation:
    runs-on: ubuntu-latest
    # `--max 60 × フルスイート` は伸び続ける（1 変異 113 秒 → 2026-09 には約 200 秒）。
    # 既定の 6 時間まで走らせる理由が無いので切っておく。**ここに当たると cancelled になり、
    # 結果もログも残らず report も走らない**（2026-09-26 の実測）ので、mutation-test.py 側の
    # `--budget-sec` をこれより手前に置いて、回せた分の結果を出して終わらせる
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # --base の解決に履歴が要る

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install-deps
        run: pip install jsonschema

      # 直近 24 時間に入った変更行を対象にする。**24h より古い最新のコミット**を base に
      # 置くことで「昨夜以降に触った行」だけを見る。24h 以内にコミットが無ければ何もしない
      # 入力は env 経由で渡す（`${{ }}` を run に直接埋めるとシェルに解釈される）
      - name: resolve-base
        env:
          INPUT_BASE: ${{ inputs.base }}
        run: |
          if [ -n "$INPUT_BASE" ]; then
            if ! base=$(git rev-parse --verify -q "${INPUT_BASE}^{commit}"); then
              echo "FATAL: 指定した起点を解決できない: ${INPUT_BASE}" >&2
              exit 1
            fi
          else
            base=$(git rev-list -1 --before="24 hours ago" HEAD)
          fi
          if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then
            echo "直近 24h に変更が無いので skip"
            echo "SKIP=1" >> "$GITHUB_ENV"
          else
            echo "比較起点: $base"
            echo "MUT_BASE=$base" >> "$GITHUB_ENV"
          fi

      # `--max 60` は「1 日ぶんの変更行なら実質全部」を狙った値。上限に当たった回は
      # ログに「N 個を対象外にした」と出るので、恒常的に当たるようなら分割を検討する。
      # `--budget-sec 9000`（150 分）は job の timeout（180 分）から準備の数分と 1 変異ぶんを引いた値。
      # 打ち切った回はログに「予算で未実行 N」と出る
      # PYTHONUNBUFFERED: パイプ越しだと出力がバッファされ、途中で殺された回のログが空になる
      # `--summary-json` は未実行の件数を report に渡す（ログの 1 行を grep で拾わない）
      - name: mutation-test
        id: mut
        if: env.SKIP != '1'
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python3 .claude-plugin/scripts/mutation-test.py \
            --base "$MUT_BASE" --max 60 --budget-sec 9000 --strict \
            --summary-json mutation-summary.json 2>&1 | tee mutation.log

      # **失敗も打ち切りも黙って流さない**。Actions の赤は見に行かないと気づけないので issue にする。
      # 起票するかと本文は mutation-nightly-report.py が決める（YAML に書くとテストできない / #288）。
      # 起点を解決できずに落ちた回（MUT_BASE が空）は変異を回していないので起票しない
      - name: report
        if: ${{ !cancelled() && env.SKIP != '1' && env.MUT_BASE != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MUT_OUTCOME: ${{ steps.mut.outcome }}
        run: |
          title=$(python3 .claude-plugin/scripts/mutation-nightly-report.py \
            --outcome "$MUT_OUTCOME" --summary mutation-summary.json --log mutation.log \
            --base "$MUT_BASE" --head "$(git rev-parse --short HEAD)" --run-url "$RUN_URL" \
            --out body.md)
          if [ -z "$title" ]; then
            echo "起票不要（生存・打ち切りなし）"
            exit 0
          fi
          # **同じ issue が open なら追記する**（毎晩新しい issue を立てない）。
          # タイトルの前方一致で引く（検索構文のエスケープに依存しない）
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title | startswith("[mutation-nightly]"))][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --label bug --body-file body.md
          fi
