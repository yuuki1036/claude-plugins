plugin: writing-polish
# カテゴリ7（平易性 / 過剰抽象）の判定校正（calibration）ケースを含む。
#
# cat7-* ケースの prompt に埋め込んだ「判定基準ダイジェスト」は
# writing-polish/skills/writing-polish/references/tone-guide.md カテゴリ7（正本）の要約。
# 正本の発火条件・保全基準を変更したらこのダイジェストも同期すること。
#
# 設計意図（issue #70）:
# - これは出力を固定する対訳辞書ではなく、発火条件が正しく fire / no-fire を
#   分離できるかの校正。期待するのは「指摘の有無」であり、言い換えの訳語ではない。
# - fire ケースの本文（「非自明な意味論」等）は判定対象のサンプルであって、
#   tone-guide に対訳をハードコードしないという方針と矛盾しない。
cases:
  # --- トリガー回帰（スキル選択） ---
  - id: polish-trigger-ja
    prompt: このPR本文を推敲して
    expected_skill: writing-polish:writing-polish
    k: 3
  - id: polish-trigger-correction-ja
    prompt: この文章を添削してほしい
    expected_skill: writing-polish:writing-polish
    k: 3

  # --- カテゴリ7 判定校正: 発火すべき入力 ---
  - id: cat7-fire-bundling
    prompt: |
      あなたは技術文書の校正者です。以下の判定基準（過剰抽象の検出）に従って、対象文に「平易に開くべき過剰抽象表現」があるか判定してください。

      発火条件（構造シグナル。単独の語の存在では発火させない）:
      - 束ね位置の抽象漢語: 同一文脈に具体語（固有名・数値・観察可能な事象）が2つ以上列挙され、それらを束ねる位置に立つ語だけが過度に抽象的な漢語のとき。決め手は置換テスト: 束ね語を「こうした挙動」等の平易な指示表現に置換しても情報が失われないなら発火する
      - density: 一文に抽象名詞が3つ以上連なり、具体語が1つもないとき
      保全条件（該当すれば発火させない。ただし置換テストが成立する束ね語は、語自体が正当な専門用語でもその文では飾りなので保全しない）:
      - 読者がその語彙を共有し、その分野の定義どおりの意味で使われている専門用語（平易語より短く正確）。定義から外れた緩用・雰囲気で借りた学術用語は保全しない
      - 精度が要求され正確な等価語がない語
      - 平易化すると曖昧さが生じる語

      対象文（一般の開発者向けドキュメントの一節）: 「この関数は引数が空のとき null を返し、タイムアウト時は例外を投げ、リトライ回数は 3 回に固定されている。利用側はこうした非自明な意味論に注意する必要がある。」

      出力形式: まず判定手順（①名詞を抽象/具体に仕分け → ②構造シグナル該当の確認（束ね語は置換テストを実施）→ ③保全条件の確認）を簡潔に書き、最終行に「結論: 指摘: <該当表現>」（発火する場合）または「結論: 推敲の必要なし」（発火しない場合）の一行を書いてください。
    k: 3
    wrapper: none
    graders:
      - type: text
        name: flags_abstract_bundler
        pattern: '結論[:：] ?指摘[:：][^\n]*意味論'
      - type: text
        name: no_false_pass
        pattern: '結論[:：][^\n]*推敲の必要なし'
        mode: must_not_match
  - id: cat7-fire-density
    prompt: |
      あなたは技術文書の校正者です。以下の判定基準（過剰抽象の検出）に従って、対象文に「平易に開くべき過剰抽象表現」があるか判定してください。

      発火条件（構造シグナル。単独の語の存在では発火させない）:
      - 束ね位置の抽象漢語: 同一文脈に具体語（固有名・数値・観察可能な事象）が2つ以上列挙され、それらを束ねる位置に立つ語だけが過度に抽象的な漢語のとき。決め手は置換テスト: 束ね語を「こうした挙動」等の平易な指示表現に置換しても情報が失われないなら発火する
      - density: 一文に抽象名詞が3つ以上連なり、具体語が1つもないとき
      保全条件（該当すれば発火させない。ただし置換テストが成立する束ね語は、語自体が正当な専門用語でもその文では飾りなので保全しない）:
      - 読者がその語彙を共有し、その分野の定義どおりの意味で使われている専門用語（平易語より短く正確）。定義から外れた緩用・雰囲気で借りた学術用語は保全しない
      - 精度が要求され正確な等価語がない語
      - 平易化すると曖昧さが生じる語

      対象文（一般の開発者向けドキュメントの一節）: 「本機能の実現にあたっては、抽象化の方向性と全体の整合性の担保が重要な課題となる。」

      出力形式: まず判定手順（①名詞を抽象/具体に仕分け → ②構造シグナル該当の確認（束ね語は置換テストを実施）→ ③保全条件の確認）を簡潔に書き、最終行に「結論: 指摘: <該当表現>」（発火する場合）または「結論: 推敲の必要なし」（発火しない場合）の一行を書いてください。
    k: 3
    wrapper: none
    graders:
      - type: text
        name: fires_on_density
        pattern: '結論[:：] ?指摘[:：]'
      - type: text
        name: no_false_pass
        pattern: '結論[:：][^\n]*推敲の必要なし'
        mode: must_not_match

  # --- カテゴリ7 判定校正: 発火させてはいけない入力（over-correction 境界） ---
  - id: cat7-nofire-jargon
    prompt: |
      あなたは技術文書の校正者です。以下の判定基準（過剰抽象の検出）に従って、対象文に「平易に開くべき過剰抽象表現」があるか判定してください。

      発火条件（構造シグナル。単独の語の存在では発火させない）:
      - 束ね位置の抽象漢語: 同一文脈に具体語（固有名・数値・観察可能な事象）が2つ以上列挙され、それらを束ねる位置に立つ語だけが過度に抽象的な漢語のとき。決め手は置換テスト: 束ね語を「こうした挙動」等の平易な指示表現に置換しても情報が失われないなら発火する
      - density: 一文に抽象名詞が3つ以上連なり、具体語が1つもないとき
      保全条件（該当すれば発火させない。ただし置換テストが成立する束ね語は、語自体が正当な専門用語でもその文では飾りなので保全しない）:
      - 読者がその語彙を共有し、その分野の定義どおりの意味で使われている専門用語（平易語より短く正確）。定義から外れた緩用・雰囲気で借りた学術用語は保全しない
      - 精度が要求され正確な等価語がない語
      - 平易化すると曖昧さが生じる語

      対象文（一般の開発者向けドキュメントの一節）: 「この API は冪等性を保証する。同じリクエストを 2 回送信しても、レコードは 1 件しか作成されない。」

      出力形式: まず判定手順（①名詞を抽象/具体に仕分け → ②構造シグナル該当の確認（束ね語は置換テストを実施）→ ③保全条件の確認）を簡潔に書き、最終行に「結論: 指摘: <該当表現>」（発火する場合）または「結論: 推敲の必要なし」（発火しない場合）の一行を書いてください。
    k: 3
    wrapper: none
    graders:
      - type: text
        name: preserves_domain_term
        pattern: '結論[:：][^\n]*推敲の必要なし'
      - type: text
        name: no_overcorrection
        pattern: '結論[:：] ?指摘[:：]'
        mode: must_not_match
  - id: cat7-nofire-concrete
    prompt: |
      あなたは技術文書の校正者です。以下の判定基準（過剰抽象の検出）に従って、対象文に「平易に開くべき過剰抽象表現」があるか判定してください。

      発火条件（構造シグナル。単独の語の存在では発火させない）:
      - 束ね位置の抽象漢語: 同一文脈に具体語（固有名・数値・観察可能な事象）が2つ以上列挙され、それらを束ねる位置に立つ語だけが過度に抽象的な漢語のとき。決め手は置換テスト: 束ね語を「こうした挙動」等の平易な指示表現に置換しても情報が失われないなら発火する
      - density: 一文に抽象名詞が3つ以上連なり、具体語が1つもないとき
      保全条件（該当すれば発火させない。ただし置換テストが成立する束ね語は、語自体が正当な専門用語でもその文では飾りなので保全しない）:
      - 読者がその語彙を共有し、その分野の定義どおりの意味で使われている専門用語（平易語より短く正確）。定義から外れた緩用・雰囲気で借りた学術用語は保全しない
      - 精度が要求され正確な等価語がない語
      - 平易化すると曖昧さが生じる語

      対象文（一般の開発者向けドキュメントの一節）: 「タイムアウトは 30 秒に設定し、超過した場合は最大 3 回までリトライする。失敗時は SlackWebhook で通知する。」

      出力形式: まず判定手順（①名詞を抽象/具体に仕分け → ②構造シグナル該当の確認（束ね語は置換テストを実施）→ ③保全条件の確認）を簡潔に書き、最終行に「結論: 指摘: <該当表現>」（発火する場合）または「結論: 推敲の必要なし」（発火しない場合）の一行を書いてください。
    k: 3
    wrapper: none
    graders:
      - type: text
        name: idempotent_on_concrete
        pattern: '結論[:：][^\n]*推敲の必要なし'
      - type: text
        name: no_overcorrection
        pattern: '結論[:：] ?指摘[:：]'
        mode: must_not_match
