plugin: dev-workflow
cases:
  - id: commit-ja
    prompt: コミットして
    expected_skill: [dev-workflow:git-commit-helper, dev-workflow:commit]
    k: 3
    graders:
      - type: behavior
        name: latency_budget
        max_latency_ms: 60000

  - id: pr-ja
    prompt: PR作って
    # コマンド名 /pr とスキル名 pr-creator が非対称なため両方を許容（#186）
    expected_skill: [dev-workflow:pr-creator, dev-workflow:pr]
    k: 3
    graders:
      - type: text
        name: has_json_marker
        pattern: '"skill"\s*:'

  - id: ui-verify-ja
    prompt: UIの動作確認して
    expected_skill: dev-workflow:ui-verify
    k: 3

  # worktree setup <-> teardown の逆発火防止
  - id: worktree-setup-ja
    prompt: worktree 作成して
    expected_skill: dev-workflow:worktree-setup
    k: 3
  - id: worktree-teardown-ja
    prompt: worktree を破棄して
    expected_skill: dev-workflow:worktree-teardown
    k: 3

  # diagnose の正発火と ui-verify との誤発火防止
  - id: diagnose-ja
    prompt: このバグ、再現したりしなかったりで原因が絞れないから診断して
    expected_skill: dev-workflow:diagnose
    k: 3
  - id: diagnose-perf-ja
    prompt: いつからか分からないけどアプリが遅くなった原因を調べて
    expected_skill: dev-workflow:diagnose
    k: 3

  # hold-out: 改訂サイクル中は実行されない（--only-tag holdout で実行）
  - id: commit-paraphrase-ja
    prompt: 今の変更をまとめて記録しておいて
    expected_skill: [dev-workflow:git-commit-helper, dev-workflow:commit]
    k: 3
    tags: [holdout]
  - id: diagnose-paraphrase-ja
    prompt: 直したはずなのにまた同じ症状が出てるんだけど、見てくれない？
    expected_skill: dev-workflow:diagnose
    k: 3
    tags: [holdout]
