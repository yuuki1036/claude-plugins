plugin: linear-workflow
cases:
  - id: dashboard-ja
    prompt: Linearのダッシュボード見せて
    expected_skill: linear-workflow:dashboard
    k: 3
  - id: init-ja
    prompt: Linear プロジェクトを初期化して
    expected_skill: linear-workflow:init
    k: 3
  - id: issue-create-ja
    prompt: Linear Issue をローカルに取り込んで
    expected_skill: linear-workflow:issue-create
    k: 3
    tags: [issue-design]
  - id: session-start-ja
    prompt: このブランチの作業を開始する
    expected_skill: linear-workflow:session-start
    k: 3
  - id: knowledge-lint-ja
    prompt: knowledge のリンク切れと孤立ページをチェックして
    expected_skill: linear-workflow:knowledge-lint
    k: 3
    tags: [knowledge]
  - id: knowledge-lint-natural
    prompt: ナレッジの健全性を点検したい
    expected_skill: linear-workflow:knowledge-lint
    k: 3
    tags: [knowledge]
  - id: knowledge-search-ja
    prompt: 過去に似た問題を解決した知見はある？
    expected_skill: linear-workflow:knowledge
    k: 3
    tags: [knowledge]
  - id: issue-design-ja
    prompt: この Issue を 9 セクション構造で設計し直したい
    expected_skill: linear-workflow:issue-design
    k: 3
    tags: [issue-design]
  - id: issue-design-natural
    prompt: 決定事項と open な判断ポイントを切り分けて Issue を設計し直したい
    expected_skill: linear-workflow:issue-design
    k: 3
    tags: [issue-design]
  # ミラー未カバー分（follow-up / issue-maintain / linear-maintain）。indie 側と
  # スキル名が異なり tail 一致で救済されないため、プロンプトに Linear 文脈を含めて弁別する
  - id: follow-up-ja
    prompt: Linear の Issue 対応中に見つけたこれは別件だから、後でやる follow-up として記録して
    expected_skill: linear-workflow:follow-up
    k: 3
  - id: issue-maintain-ja
    prompt: セッション終了前に、今日の作業内容を Linear 連携の Issue ファイルに反映して整理して
    expected_skill: linear-workflow:issue-maintain
    k: 3
  - id: linear-maintain-ja
    prompt: Linear と同期してローカルの Issue 管理ファイルを最新化して
    expected_skill: linear-workflow:linear-maintain
    k: 3
