plugin: code-review
cases:
  - id: review-ja
    prompt: このPRをレビューして
    expected_skill: code-review:review
    k: 3
  - id: self-review-ja
    prompt: コミット前にセルフレビューして
    expected_skill: code-review:self-review
    k: 3
  # review <-> self-review の弁別境界（「コミット前」は self、「PR」は review）
  - id: self-review-precommit-ja
    prompt: コミット前に確認したい
    expected_skill: code-review:self-review
    k: 3
  - id: review-pr-ja
    prompt: この PR をレビューして
    expected_skill: code-review:review
    k: 3
  # review <-> review-triage の弁別境界（「レビューする」は review、「付いたコメントに対応する」は triage）
  - id: review-triage-ja
    prompt: PR に付いたレビューコメントを精査して、対応するか仕分けて
    expected_skill: code-review:review-triage
    k: 3
  - id: review-triage-bot-ja
    prompt: レビュー bot のコメントに返信したいので、どれを直すべきか見て
    expected_skill: code-review:review-triage
    k: 3
  # 逆方向の回帰: review-triage 追加で comment-polish の「コメント精査」が奪われないか
  - id: comment-polish-not-stolen-ja
    prompt: 追加したコード内コメントを精査して直して
    expected_skill: code-review:comment-polish
    k: 3
  # review-guide の起動（PR を理解するための読み順）
  - id: review-guide-ja
    prompt: この PR を後から理解したいので読み順を教えて
    expected_skill: code-review:review-guide
    k: 3
  - id: review-guide-walkthrough-ja
    prompt: この PR が何をやっているか、重要なファイルから順に解説して
    expected_skill: code-review:review-guide
    k: 3
  # 逆方向の回帰: review-guide 追加で review（指摘を出す）が奪われないか
  - id: review-not-stolen-by-guide-ja
    prompt: この PR をレビューして問題を指摘して
    expected_skill: code-review:review
    k: 3
