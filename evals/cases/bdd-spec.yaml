plugin: bdd-spec
# コマンド名 bdd-spec-create とスキル名 create-spec が非対称のため両方を許容
# （design-doc.yaml の nofire ケースと同じ前例）。
cases:
  - id: bdd-spec-create-ja
    prompt: この機能の BDD spec を作って
    expected_skill: [bdd-spec:create-spec, bdd-spec:bdd-spec-create]
    k: 3
  - id: bdd-spec-user-story-ja
    prompt: user story を scaffold して
    expected_skill: [bdd-spec:create-spec, bdd-spec:bdd-spec-create]
    k: 3
  - id: bdd-spec-scenario-ja
    prompt: 振る舞いの仕様を Scenario で書きたい
    expected_skill: [bdd-spec:create-spec, bdd-spec:bdd-spec-create]
    k: 3
  - id: bdd-spec-equivalence-ja
    prompt: 同値分割表のテンプレを用意して
    expected_skill: [bdd-spec:create-spec, bdd-spec:bdd-spec-create]
    k: 3
  - id: bdd-spec-transition-table-ja
    prompt: 状態遷移表つきの BDD spec を scaffold して
    expected_skill: [bdd-spec:create-spec, bdd-spec:bdd-spec-create]
    k: 3

  # --- evaluate-spec トリガー回帰 ---
  - id: evaluate-spec-ja
    prompt: この spec.md をレビューして品質をチェックして
    expected_skill: [bdd-spec:evaluate-spec, bdd-spec:bdd-spec-evaluate]
    k: 3
  - id: evaluate-spec-coverage-ja
    prompt: 同値分割表と Scenario の網羅性チェックして
    expected_skill: [bdd-spec:evaluate-spec, bdd-spec:bdd-spec-evaluate]
    k: 3
  - id: evaluate-spec-holes-ja
    prompt: BDD spec の穴を見つけて
    expected_skill: [bdd-spec:evaluate-spec, bdd-spec:bdd-spec-evaluate]
    k: 3
  - id: evaluate-spec-transition-ja
    prompt: 状態遷移の網羅性を spec でチェックして
    expected_skill: [bdd-spec:evaluate-spec, bdd-spec:bdd-spec-evaluate]
    k: 3

  # --- create ⇔ evaluate の弁別（作る=create、評価する=evaluate） ---
  - id: bdd-spec-create-not-evaluate
    prompt: 新しい user story の spec を作って
    expected_skill: [bdd-spec:create-spec, bdd-spec:bdd-spec-create]
    k: 3
