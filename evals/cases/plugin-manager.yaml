plugin: plugin-manager
# command のみのプラグイン（skill なし）。コマンド名 plugin-manager:update-all を期待値にする。
cases:
  - id: update-all-ja
    prompt: 自作プラグインを最新版に一括アップデートして
    expected_skill: plugin-manager:update-all
    k: 3
  - id: update-all-installed-ja
    prompt: インストール済みのプラグインをまとめて更新して
    expected_skill: plugin-manager:update-all
    k: 3

  # --- 誤発火防止 ---
  # 「CC の新機能をプラグインに取り込む」は claude-meta:cc-catch-up の領分
  # （プラグイン本体の一括更新 = update-all との弁別）
  - id: update-all-nofire-catch-up
    prompt: Claude Code の最新アップデートをキャッチアップしてプラグインを改善して
    expected_skill: [claude-meta:cc-catch-up, claude-meta:catch-up]
    k: 3
