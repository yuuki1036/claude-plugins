plugin: feature-dev
# command と skill の同名ペア。ルーターに載るのは commands/feature-dev.md の description（#206）なので、
# トリガーフレーズを足すときは commands 側と SKILL.md の両方を直すこと。
cases:
  - id: feature-dev-ja
    prompt: この機能をワークフローに沿って開発して
    expected_skill: feature-dev:feature-dev
    k: 3
  - id: feature-dev-guided-ja
    prompt: 機能開発ワークフローで実装を進めて
    expected_skill: feature-dev:feature-dev
    k: 3

  # --- 誤発火防止（隣接スキルへのルーティング） ---
  # 「課題の発見・起票」は indie-issue-discover の領分
  - id: feature-dev-nofire-discover
    prompt: やることを洗い出して issue を自動で作って
    expected_skill: issue-workflow:discover
    k: 3
  # 「設計だけ詰める」は design-doc の領分（実装込みの feature-dev と弁別）
  - id: feature-dev-nofire-design-doc
    prompt: 実装せず設計だけ詰めたい
    expected_skill: design-doc:design-doc
    k: 3

  # --- skill 化で追加したトリガーフレーズ（#219 の hop ペア化と同時に追加） ---
  - id: feature-dev-new-feature-ja
    prompt: 新機能を実装したいので設計から実装まで通してほしい
    expected_skill: feature-dev:feature-dev
    k: 3
  - id: feature-dev-plan-ja
    prompt: この機能の実装計画を立てて
    expected_skill: feature-dev:feature-dev
    k: 3
  # 「セッション開始」は issue-workflow:start の領分（feature-dev と弁別）
  - id: feature-dev-nofire-start
    prompt: 作業開始
    expected_skill: issue-workflow:start
    k: 3
