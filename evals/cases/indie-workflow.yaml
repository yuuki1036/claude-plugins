plugin: indie-workflow
cases:
  - id: indie-start-ja
    prompt: 今日の個人開発を開始する
    expected_skill: indie-workflow:indie-start
    k: 3
  - id: indie-issue-create-ja
    prompt: 新しいタスクを起票して
    expected_skill: indie-workflow:indie-issue-create
    k: 3
    tags: [issue-design]
  - id: retrospective-ja
    prompt: 今月の個人開発を振り返る
    expected_skill: indie-workflow:retrospective
    k: 3
  - id: knowledge-lint-ja
    prompt: knowledge のリンク切れと孤立ページをチェックして
    expected_skill: indie-workflow:knowledge-lint
    k: 3
    tags: [knowledge]
  - id: knowledge-lint-natural
    prompt: ナレッジの健全性を点検したい
    expected_skill: indie-workflow:knowledge-lint
    k: 3
    tags: [knowledge]
  - id: knowledge-search-ja
    prompt: 過去に似た問題を解決した知見はある？
    expected_skill: indie-workflow:knowledge
    k: 3
    tags: [knowledge]
  - id: issue-design-ja
    prompt: この Issue を 9 セクション構造で設計し直したい
    expected_skill: indie-workflow:issue-design
    k: 3
    tags: [issue-design]
  - id: issue-design-natural
    prompt: 決定事項と open な判断ポイントを切り分けて Issue を設計し直したい
    expected_skill: indie-workflow:issue-design
    k: 3
    tags: [issue-design]
  - id: indie-issue-discover-ja
    prompt: このプロジェクトの課題を見つけて issue を自動で作って
    expected_skill: indie-workflow:indie-issue-discover
    k: 3
  - id: indie-issue-discover-natural
    prompt: 何かやることない？バグとか未実装を洗い出して起票しといて
    expected_skill: indie-workflow:indie-issue-discover
    k: 3
  # ミラー未カバー分（follow-up / init / issue-maintain / maintain）。mirror 相手と
  # スキル名が異なり tail 一致で救済されないため、プロンプトに indie 文脈（個人開発/ローカル）を含めて弁別する
  - id: indie-follow-up-ja
    prompt: 個人開発の作業中に見つけたこれは別件だから、後でやるタスクとしてメモしておいて
    expected_skill: indie-workflow:indie-follow-up
    k: 3
  - id: indie-init-ja
    prompt: このプロジェクトでローカルの個人開発 Issue 管理を始めたい。初期セットアップして
    expected_skill: indie-workflow:indie-init
    k: 3
  - id: indie-issue-maintain-ja
    prompt: セッション終了前に、今日の作業内容をローカルの Issue ファイルに反映して整理して
    expected_skill: indie-workflow:indie-issue-maintain
    k: 3
  - id: indie-maintain-ja
    prompt: 個人開発プロジェクト全体を棚卸しして、放置している Issue を整理したい
    expected_skill: indie-workflow:indie-maintain
    k: 3
